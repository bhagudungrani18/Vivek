<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A55A" />
      <stop offset="50%" stop-color="#D4B96E" />
      <stop offset="100%" stop-color="#A68B3E" />
    </linearGradient>
  </defs>

  <!-- Outer Traditional Mandala Ring -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="1, 3" />
  <circle cx="50" cy="50" r="40" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
  
  <!-- Flourish Ornaments -->
  <path d="M 50 12 C 45 22, 55 22, 50 30 C 45 22, 55 22, 50 12 Z" fill="url(#goldGrad)" opacity="0.8" />
  <path d="M 50 88 C 45 78, 55 78, 50 70 C 45 78, 55 78, 50 88 Z" fill="url(#goldGrad)" opacity="0.8" />
  <path d="M 12 50 C 22 45, 22 55, 30 50 C 22 45, 22 55, 12 50 Z" fill="url(#goldGrad)" opacity="0.8" />
  <path d="M 88 50 C 78 45, 78 55, 70 50 C 78 45, 78 55, 88 50 Z" fill="url(#goldGrad)" opacity="0.8" />
  
  <!-- Monogram Initials "VR" -->
  <text x="50%" y="58%" 
        font-family="'Playfair Display', 'Georgia', serif" 
        font-size="22" 
        font-weight="bold" 
        fill="url(#goldGrad)" 
        text-anchor="middle" 
        letter-spacing="1">VR</text>

  <!-- Small inner star -->
  <polygon points="50,65 52,69 56,69 53,72 54,76 50,74 46,76 47,72 44,69 48,69" fill="url(#goldGrad)" opacity="0.6" />
</svg>